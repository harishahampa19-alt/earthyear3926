name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # site/ becomes the document root, with data/ copied in beside it.
        # app.js probes ../data/results.json first and data/results.json
        # second, so the same source works from the repo and from here.
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/data
          cp data/results.json data/results.csv _site/data/
          test -f _site/index.html
          test -f _site/data/results.json
          echo "assembled:"; find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
